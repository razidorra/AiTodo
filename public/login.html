<!doctype html>
<html lang="de" data-theme="winter">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | TodoFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="./clerk-auth.js"></script>
  </head>
  <body class="min-h-screen bg-base-200 text-base-content">
    <main class="mx-auto grid min-h-screen w-full max-w-6xl gap-5 px-3 py-5 sm:gap-6 sm:px-6 sm:py-6 lg:grid-cols-[minmax(0,1fr)_minmax(340px,440px)] lg:items-center lg:px-8">
      <section class="flex min-w-0 flex-col gap-5">
        <a class="link link-hover w-fit text-sm font-semibold text-primary" href="./index.html">Zur Todo App</a>
        <div class="max-w-2xl">
          <p class="text-sm font-semibold uppercase tracking-wide text-primary">TodoFlow Account</p>
          <h1 class="mt-2 text-3xl font-bold sm:text-5xl">Login</h1>
          <p class="mt-4 max-w-xl text-base leading-7 text-base-content/70">
            Melde dich erst an, nachdem du einen Account registriert hast.
          </p>
          <div class="mt-5 rounded-lg bg-base-100 p-4 shadow">
            <p class="text-sm font-medium">Noch keinen Account?</p>
            <a class="btn btn-primary mt-3 w-full sm:w-auto" href="./register.html">Jetzt registrieren</a>
          </div>
        </div>
        <div id="signed-in-panel" class="hidden max-w-md rounded-lg bg-base-100 p-5 shadow">
          <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
            <div class="min-w-0">
              <p class="font-semibold">Du bist angemeldet</p>
              <p id="user-email" class="truncate text-sm text-base-content/70"></p>
            </div>
            <div id="user-button"></div>
          </div>
          <a class="btn btn-primary mt-4 w-full" href="./index.html">Zur App</a>
        </div>
      </section>

      <section class="card min-w-0 bg-base-100 shadow">
        <div class="card-body p-4 sm:p-8">
          <div id="clerk-status" class="alert">
            <span>Clerk wird geladen...</span>
          </div>
          <div id="sign-in"></div>
        </div>
      </section>
    </main>
  </body>
</html>
